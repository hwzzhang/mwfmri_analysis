[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mwfmri-analysis"
version = "0.1.0"
description = "Nested cross-validation analysis of movie-watching fMRI features"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.7",
  "nibabel>=5.1",
  "nilearn>=0.10",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "tqdm>=4.65",
]

[tool.setuptools]
packages = []
